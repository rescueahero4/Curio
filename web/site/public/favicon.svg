<!--
  The Curio mark, from assets/brand/curio-mark.svg — same path data, different viewBox.

  The source box is 0 0 500 500, but the path sits at roughly x∈[25,476], y∈[45,455]: it is
  off-centre and nearly touches three edges, so at favicon sizes it reads as cropped. The
  padded box below is the one assets/brand/rasterize.mjs already renders the PNG icons
  through, so the tab icon and the tray icon are now framed identically.

  The square width/height against a 480x440 viewBox is deliberate, not a mismatch: it is
  what rasterize.mjs does (a size x size viewport), and the default xMidYMid meet then
  centres the mark with a little breathing room. Making the box 480x440 instead would frame
  it differently from every other icon in the project.
-->
