<!--
  The Model Context Protocol mark (Octicon `mcp-16`), as the design specifies.

  The only icon here not from Tabler, because Tabler has no MCP glyph and a generic
  stand-in would say "some protocol" rather than naming the one Curio speaks.

  Normalised to `currentColor` so it takes its colour from CSS like every Tabler icon
  beside it; the Figma export had `fill="black"` baked in, which would have gone invisible
  on any dark surface. The clip path was dropped — it clipped to the icon's own bounds and
  did nothing but carry a duplicate id across inlined copies.
-->
