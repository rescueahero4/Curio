# The release pipeline.
#
# Two invocations, one script (R-DEL-6): the pull-request path runs the gate, and this path
# runs the same gate on all three release targets, then packages and reports the footprint.
#
# R-DEL-5: all three targets must build on every release tag.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup show
          rustup target add ${{ matrix.target }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/spa/package-lock.json
            web/extension/package-lock.json

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Install web dependencies
        run: |
          npm --prefix web/spa ci
          npm --prefix web/extension ci

      - name: Gate
        run: cargo gate

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # R-DEL-7: a tracked report, not a hard gate. CI runners measure memory noisily, so a
      # regression blocks release by human decision rather than by script — but it must be
      # visible, because a budget that is never measured is a budget that is silently missed
      # (D17).
      - name: Footprint report
        continue-on-error: true
        run: cargo xtask footprint > footprint-${{ matrix.target }}.txt || true

      - uses: actions/upload-artifact@v4
        with:
          name: curio-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/curio*
            footprint-${{ matrix.target }}.txt
          if-no-files-found: warn

  # Packaging — signed .app with notarisation, MSI/MSIX, and the MCPB bundle — lands in P6
  # (R-DEL-8, R-DEL-9, R-DEL-10). Three of its decisions are still open D0 rows: MSI vs
  # MSIX, the `mcpb pack` CLI shape, and the binary-server manifest fields. The jobs are
  # deliberately absent rather than stubbed, so a green release cannot imply that packaging
  # ran.
