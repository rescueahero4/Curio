# The landing page — https://rescueahero4.github.io/Curio/
#
# Deliberately separate from ci.yml. R-DEL-6 makes one gate script the sole definition of
# "green" and forbids CI restating its steps; publishing a marketing page is not a gate,
# and folding it into `cargo gate` would mean every Rust PR waits on an Astro build while
# a broken page could block a merge that has nothing to do with it.

name: Pages

on:
  push:
    branches: [master]
    # Only the site's own sources can change it — it no longer republishes `docs/`.
    paths:
      - "web/site/**"
      - ".github/workflows/pages.yml"
  # So the site can be republished without an empty commit.
  workflow_dispatch:

# GITHUB_TOKEN needs `pages: write` to publish and `id-token: write` for the OIDC token
# deploy-pages exchanges with the Pages service. Read-only elsewhere.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one mid-flight: an interrupted deploy can leave
# the live site on a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/site/package-lock.json

      # `npm install`, not `npm ci`, and not by preference.
      #
      # Astro 7 pulls rolldown and satteri, which ship wasm32 fallbacks whose own
      # dependencies (@emnapi/core, @emnapi/runtime) npm never resolves on Windows, where
      # this lockfile is written — those variants are not installable there, so they get no
      # entry. On a Linux runner npm does resolve them, finds them absent from the lock, and
      # `npm ci` refuses the whole install. Regenerating the lockfile locally cannot fix it:
      # it comes back byte-identical, including with --os=linux --cpu=x64.
      #
      # `npm install` still honours the lockfile for everything in it and fills only that
      # platform gap. The cost is that a transitive patch release can differ between runs,
      # which for a static marketing page is a smaller problem than a deploy that cannot run
      # at all. Revisit if the lockfile is ever generated on Linux.
      - name: Install
        run: npm --prefix web/site install --no-audit --no-fund

      # Injects the base path Pages serves from. Without this the build hardcodes
      # whatever is in astro.config.mjs, which is right today and wrong the moment a
      # custom domain is added.
      - uses: actions/configure-pages@v5

      - name: Build
        run: npm --prefix web/site run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
