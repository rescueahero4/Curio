# Keeps "ready for review" honest.
#
# GitHub cannot gate PR *creation* on CI — the checks only exist once a PR does. So the
# rule we actually want ("don't ask for review until the gate is green") is enforced from
# the other side: when CI fails on a contributor's open PR, this workflow pushes it back
# to draft. Marking it ready again re-runs CI, which either sticks or bounces it once more.
#
# Repository admins are exempt. They can already bypass the master ruleset, so demoting
# their PRs would be theatre.
#
# This uses `workflow_run` rather than living inside ci.yml for two reasons: it needs a
# write token that a fork's PR run is never given, and it needs to observe the *whole* CI
# run's conclusion rather than one matrix leg.

name: Draft gate

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  to-draft:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;

            // run.pull_requests is empty for PRs from forks, so match on the head SHA
            // instead — that works for both.
            const open = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const pr = open.find(p => p.head.sha === run.head_sha);

            if (!pr) {
              core.info(`No open PR at ${run.head_sha}; nothing to demote.`);
              return;
            }
            if (pr.draft) {
              core.info(`#${pr.number} is already a draft.`);
              return;
            }

            let permission = 'none';
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner, repo, username: pr.user.login,
              });
              permission = data.permission;
            } catch {
              // Fork contributors are not collaborators; the 404 means "no permission".
            }
            if (permission === 'admin') {
              core.info(`#${pr.number} is from an admin (${pr.user.login}); leaving it alone.`);
              return;
            }

            await github.graphql(
              `mutation($id: ID!) {
                 convertPullRequestToDraft(input: { pullRequestId: $id }) {
                   pullRequest { number isDraft }
                 }
               }`,
              { id: pr.node_id },
            );

            await github.rest.issues.createComment({
              owner, repo, issue_number: pr.number,
              body: [
                `The gate failed on \`${run.head_sha.slice(0, 7)}\`, so this PR is back in draft.`,
                '',
                `[CI run](${run.html_url}) · reproduce locally with \`cargo gate\`.`,
                '',
                'Push a fix and mark it ready for review again — CI reruns on that,',
                'and master only accepts a green branch.',
              ].join('\n'),
            });

            core.notice(`#${pr.number} converted to draft: gate failed.`);
