[package]
name = "curio-tray"
description = "The curio binary: native event loop, tray menu, service thread."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "curio"
path = "src/main.rs"

[dependencies]
curio-core = { workspace = true }
curio-mcp = { workspace = true }
curio-runtime = { workspace = true }
curio-server = { workspace = true }

tokio = { workspace = true }
tray-icon = { workspace = true }
# Decodes the bundled brand mark. `png` only — the tray loads exactly one asset.
image = { version = "0.25.10", default-features = false, features = ["png"] }
tao = { workspace = true }

anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
getrandom = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3.27.0"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

# Embeds the brand mark as a PE icon resource so curio.exe is not a generic glyph in
# Explorer, the taskbar, and the Start Menu (see build.rs). Build-only and host-gated: it
# never enters the dependency graph of the shipped binary, and `cargo tree` on the release
# profile does not see it.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.24"
